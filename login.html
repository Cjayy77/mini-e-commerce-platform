<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AGRO-TECH - Log in to your agro-biotech account in Cameroon.">
    <title>E-commerce - Log In</title>
    <link rel="stylesheet" href="login.css">
    
</head>
<body>
<main class="login-page">
    </div>

    <div class="login-form-wrapper">
        <div class="login-form-container">
            <div class="login-form-card">
                <h2>E-COMMERCE LOGIN PAGE</h2>
                <div class="separator">
                    <span>WELCOME</span>
                </div>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group password-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" id="togglePassword" class="toggle-password">👁️</button>
                    </div>
                    <button type="submit" class="btn btn-primary login-btn">Log In</button>
                    <div id="error-message" style="display:none; color:red;">
  Invalid login details
</div>

                </form>
                <script src="login.js" defer></script>
                <div class="login-footer">
                    <p>Don't have an account? <a href="register.html">Register now</a></p>
                    <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                </div>
            </div>
        </div>
    </div>
</main>
<script>
document.getElementById('togglePassword').addEventListener('click', function (e) {
    const passwordInput = document.getElementById('password');
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.textContent = type === 'password' ? '👁️' : '🔒';
});
</script>
</body>
</html>
